name: 기능 요청
description: 바라는 동작이나 개선
title: "FEAT-NN "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        이슈는 요구를 기록하는 곳입니다. 작업 지시(읽을 파일, 고치는 방법)는 적지 않습니다.
        개인정보(이메일, 사용자 폴더 경로, 키·토큰)는 적지 않습니다.
  - type: input
    id: feat-id
    attributes:
      label: FEAT ID
      placeholder: FEAT-05
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: 바라는 점
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 왜 필요한지, 지금은 어떤지
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위
      placeholder: |
        포함:
        제외:
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      placeholder: |
        - [ ]
    validations:
      required: true
  - type: checkboxes
    id: verify
    attributes:
      label: 검증 방법
      description: 사람만 확인할 수 있으면 그 이유를 아래 확인 항목에 적습니다.
      options:
        - label: 자동 (typecheck, lint, Playwright)
        - label: 수동 (사람이 화면에서 확인)
        - label: 사람만 가능 (청감 등)
  - type: textarea
    id: checks
    attributes:
      label: 실제 동작 확인 항목
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
