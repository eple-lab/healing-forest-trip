# Render Blueprint
# ─────────────────────────────────────────────
# 1) Neon 에서 프로젝트를 만들고 DATABASE_URL 을 복사합니다.
# 2) Render Dashboard → New → Blueprint → 이 저장소를 선택합니다.
# 3) 아래 sync:false 값(NEXTAUTH_SECRET, DATABASE_URL, Google 키)을 입력합니다.
# 4) 배포 후 Google OAuth 리디렉션 URI 에 운영 주소를 추가합니다.
services:
  - type: web
    name: healing-forest-trip
    runtime: node
    plan: free                 # 빼면 유료(0.5c-512mb)로 만들어진다
    region: singapore          # 아시아/태평양: 싱가포르(서울과 제일 가까운 곳). 만든 뒤에는 바꿀 수 없다
    branch: main
    autoDeploy: true
    # NODE_ENV=production 은 빌드에도 적용되어 npm ci 가 devDependencies 를 빼므로 --include=dev 로 받는다.
    # 빌드가 끝나면 prune 으로 dev 패키지(typescript, eslint 등)를 지워 실행 환경에는 운영용만 남긴다.
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 20.11.1 ## package.json engines
      - key: NODE_ENV
        value: production      # 실행 설정. server.mjs 가 이 값으로 운영 모드와 부팅 검증을 켠다
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Render 가 제공하는 외부 URL 을 NextAuth 가 자동으로 사용합니다.
      # 별도 도메인을 쓰면 NEXTAUTH_URL 을 직접 지정하세요.
      - key: ALLOW_GUEST_LOGIN
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA
        sync: false
      - key: PG_POOL_MAX
        value: "5"
